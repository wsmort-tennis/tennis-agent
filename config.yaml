# ─────────────────────────────────────────────────────────────
#  Tennisbane-agentens indstillinger
#  Du kan ændre alt her direkte på GitHub (blyant-ikonet).
#  Linjer der starter med # er kommentarer og bliver ignoreret.
#  Tider skrives altid som "TT:MM" i dansk tid.
# ─────────────────────────────────────────────────────────────

hal:
  navn: Rundforbi Tennishal
  url: https://rundforbi.halbooking.dk/newlook/proc_baner.asp
  adresse: Rundforbivej 140 B, 2850 Nærum

filtre:
  # Hvor mange dage frem agenten kigger (hallen viser ca. 4 uger)
  dage_frem: 28

  # Korteste spilletid du vil have foreslået (minutter)
  minimum_varighed_min: 60

  # Fri tid der skal være i din kalender før og efter spillet (minutter)
  buffer_min: 30

  # Hvilke ugedage du vil spille. Fjern dem du ikke vil have med.
  ugedage: [man, tir, ons, tor, fre, lør, søn]

  # Tidligste starttid og seneste sluttid, du overhovedet vil spille
  tidligste_start: "06:30"
  seneste_slut: "23:00"

  # Tidsrum hvor du ALDRIG kan spille (en bane der rører tidsrummet frasorteres)
  blokeret:
    hverdage:
      - ["11:30", "12:30"]
    weekend: []

# Prime time = de tider du helst vil have. Kun de giver en push-besked.
# Resten kommer stadig i kalenderen og tabellen.
# Banen skal ligge HELT inde i et af tidsrummene.
prime_time:
  hverdage:
    - ["14:00", "22:00"]
  weekend:
    - ["09:00", "19:00"]

kalender:
  # Heldagsbegivenheder (fx fødselsdage) blokerer ikke for tennis
  ignorer_heldagsbegivenheder: true
  # Kalendere i iCloud der ikke skal tælle som "optaget"
  ignorer_kalendere: ["Ledige tennisbaner"]
  # Kalendere hvor buffer-reglen ikke gælder (fx tennistræning i hallen).
  # Tiden må gerne ligge lige op ad, men aldrig overlappe.
  uden_buffer_kalendere: ["Træning"]
  # Titel på begivenhederne i kalenderen "Ledige tennisbaner"
  titel: "Ledig bane"

notifikation:
  # Send kun besked om tider, der starter mindst så mange timer ude i fremtiden
  min_timer_frem: 2
